org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Use the standalone Kotlin Gradle plugin (pinned to 2.4.0) instead of AGP 9's built-in Kotlin.
android.builtInKotlin=false
android.newDsl=false
# Slow / flaky links: longer timeouts and more retries for dependency downloads.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
systemProp.java.net.preferIPv4Stack=true
